<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timm 18! 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .intro-screen, .quiz-screen, .result-screen {
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        .intro-screen.active, .quiz-screen.active, .result-screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1 {
            color: #667eea;
            font-size: 3em;
            margin-bottom: 20px;
            text-align: center;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .start-btn, .submit-btn, .reveal-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .start-btn:hover, .submit-btn:hover, .reveal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .question-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
            animation: slideRight 0.5s ease-out;
        }

        @keyframes slideRight {
            from {
                transform: translateX(-100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .question-text {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option:hover {
            border-color: #667eea;
            transform: translateX(5px);
            background: #f0f4ff;
        }

        .option input {
            margin-right: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.5s ease;
        }

        .result-screen h2 {
            color: #667eea;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .score-display {
            text-align: center;
            font-size: 4em;
            color: #764ba2;
            margin: 30px 0;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .verdict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.3em;
            margin: 20px 0;
        }

        .gift-box {
            background: #fff3cd;
            border: 3px dashed #ffc107;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
            display: none;
        }

        .gift-box.show {
            display: block;
            animation: tada 1s;
        }

        @keyframes tada {
            0% { transform: scale(1) rotate(0deg); }
            10%, 20% { transform: scale(0.9) rotate(-3deg); }
            30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); }
            40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .code-display {
            background: #333;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.8em;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
            letter-spacing: 3px;
            word-break: break-all;
        }

        .emoji {
            font-size: 3em;
            display: block;
            margin: 20px 0;
        }

        .from {
            text-align: center;
            color: #666;
            font-style: italic;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .subtitle {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Intro Screen -->
        <div class="intro-screen active">
            <h1>🎉 TIMM 18! 🎉</h1>
            <div class="subtitle">
                Enne kui saad kingitust, pead tõestama,<br>
                et oled TÕESTI väärt 18 aastaseks saama!
            </div>
            <div class="emoji">🤔❓🎂</div>
            <button class="start-btn" onclick="startQuiz()">ALUSTA TESTI!</button>
        </div>

        <!-- Quiz Screen -->
        <div class="quiz-screen">
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            
            <div id="questionsContainer"></div>
            
            <button class="submit-btn" onclick="checkAnswers()">VASTA!</button>
        </div>

        <!-- Result Screen -->
        <div class="result-screen">
            <h2 id="resultTitle"></h2>
            <div class="score-display" id="scoreDisplay"></div>
            <div class="verdict" id="verdict"></div>
            
            <button class="reveal-btn" onclick="revealGift()">AVAN KINGITUSE! 🎁</button>
            
            <div class="gift-box" id="giftBox">
                <div class="emoji">🎮💝🎉</div>
                <h3 style="color: #667eea; margin-bottom: 15px;">Palju õnne, Timm!</h3>
                <p style="margin-bottom: 20px;">Siin on sinu Steam giftcard kood:</p>
                <div class="code-display" id="steamCode">STEAM XXXX XXXX XXXX XXXX</div>
                <p style="color: #666; margin-top: 20px;">
                    Ole tubli täiskasvanud! 😎<br>
                    Naudi mänge ja ära kuluta kõike korraga... või kuluta! 🤷‍♂️
                </p>
                <div class="from">
                    💚 Heili ja Magnus 💚
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Kas sa tead, mis on maksud?",
                options: [
                    "See asi, mis teeb iga palga väiksemaks 😢",
                    "Mingi pokémon",
                    "Maksad on vabatahtlikud, eks?"
                ],
                correct: 0
            },
            {
                q: "Kas sa oskad teha praadmune ilma köögist välja põlemata?",
                options: [
                    "Jah, olen professionaal!",
                    "Tuletõrje on kiirvalimises",
                    "Ma söön ainult sushi"
                ],
                correct: 0
            },
            {
                q: "Mida tähendab 'täiskasvanud elu'?",
                options: [
                    "Igav, aga vähemalt saab alkoholi osta",
                    "Pidev paanikahood ja kohvi joomine",
                    "Lõpuks saan kõike teha mis tahan! 🎉"
                ],
                correct: 1
            },
            {
                q: "Kas sa oled kunagi ööklubist ukse ees tagasi saadetud?",
                options: [
                    "Jah, aga nüüd enam ei saa! 😎",
                    "Ei, ma olen alati sees olnud... salaja",
                    "Mis on ööklubi?"
                ],
                correct: 0
            },
            {
                q: "Mida sa teed, kui autol on kumm tühi?",
                options: [
                    "Helistan Googlelile",
                    "Vahetan ise välja nagu boss",
                    "Jätan auto maha ja ostan uue"
                ],
                correct: 1
            },
            {
                q: "Mis kell on 'normaalne' ärkamisaeg täiskasvanul?",
                options: [
                    "7:00 hommikul",
                    "Kui päike äratab",
                    "Sõltub... pühapäeval 15:00 on normaalne"
                ],
                correct: 2
            },
            {
                q: "Kas sa oskad pesupesemismasinat kasutada?",
                options: [
                    "Jah, kõik värvid koos, 90 kraadi!",
                    "Ei, ema teeb ikka",
                    "Jah, ja ma tean isegi et valget ja värvilist ei saa segada"
                ],
                correct: 2
            },
            {
                q: "Mida tähendab 'kodukindlustus'?",
                options: [
                    "Mingi täiskasvanu asi, mida ma kunagi vajan",
                    "Kindlustus juhuks kui sõbrad peo teevad",
                    "Ei tea, ei vaja"
                ],
                correct: 0
            }
        ];

        let currentAnswers = {};

        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7', '#00b894'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 50);
            }
        }

        function startQuiz() {
            document.querySelector('.intro-screen').classList.remove('active');
            document.querySelector('.quiz-screen').classList.add('active');
            
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.style.animationDelay = (index * 0.1) + 's';
                
                let optionsHTML = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHTML += `
                        <label class="option">
                            <input type="radio" name="q${index}" value="${optIndex}">
                            ${opt}
                        </label>
                    `;
                });
                
                card.innerHTML = `
                    <div class="question-text">${index + 1}. ${q.q}</div>
                    <div class="options">
                        ${optionsHTML}
                    </div>
                `;
                
                container.appendChild(card);
            });
            
            updateProgressBar();
        }

        function updateProgressBar() {
            const answered = Object.keys(currentAnswers).length;
            const progress = (answered / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        document.addEventListener('change', (e) => {
            if (e.target.type === 'radio') {
                const questionNum = e.target.name.replace('q', '');
                currentAnswers[questionNum] = parseInt(e.target.value);
                updateProgressBar();
            }
        });

        function checkAnswers() {
            if (Object.keys(currentAnswers).length < questions.length) {
                alert('Palun vasta kõigile küsimustele! 😅');
                return;
            }
            
            let score = 0;
            questions.forEach((q, index) => {
                if (currentAnswers[index] === q.correct) {
                    score++;
                }
            });
            
            showResults(score);
        }

        function showResults(score) {
            document.querySelector('.quiz-screen').classList.remove('active');
            document.querySelector('.result-screen').classList.add('active');
            
            const percentage = Math.round((score / questions.length) * 100);
            
            document.getElementById('scoreDisplay').textContent = score + '/' + questions.length;
            
            let title, verdict;
            
            if (percentage >= 75) {
                title = "🎉 PALJU ÕNNE! 🎉";
                verdict = "Sa oled ABSOLUUTSELT väärt 18 aastaseks saama! Täiskasvanud elu võib tulla! 🚀";
                createConfetti();
            } else if (percentage >= 50) {
                title = "😅 NO NOJAH...";
                verdict = "Põhimõtteliselt... oled sa valmis. Ehk. Tõenäoliselt. Kingitus ikka! 🎁";
            } else {
                title = "😬 HMMMM...";
                verdict = "Tehniliselt sa oled 18, nii et kingitus tuleb. Aga õpi veel natuke! 📚";
            }
            
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('verdict').textContent = verdict;
        }

        function revealGift() {
            const giftBox = document.getElementById('giftBox');
            giftBox.classList.add('show');
            document.getElementById('steamCode').textContent = 'Pmst puntkid.ee on haigelt aeglased peded seega ma kirjan discis kui ma selle saan';
            createConfetti();
            
            document.querySelector('.reveal-btn').style.display = 'none';
        }

        // Add some floating confetti on page load
        setTimeout(createConfetti, 500);
    </script>
</body>
</html>
